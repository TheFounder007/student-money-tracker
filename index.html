<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header class="header">
      <h1>Student Expense Tracker</h1>
      <p> places where your money goes</p>
    </header>
    <section class="card">
      <h2 class="card-title">Add New Expense</h2>
      <form id="expenseForm" novalidate>
        <div class="form-grid">

          <div class="form-group">
            <label for="expenseName">Expense Name</label>
            <input type="text" id="expenseName" placeholder="e.g. Lunch at canteen">
            <small class="error" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="expenseAmount">Amount (₹)</label>
            <input type="number" id="expenseAmount" placeholder="e.g. 120" step="0.01">
            <small class="error" id="amountError"></small>
          </div>

          <div class="form-group">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory">
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Education">Education</option>
              <option value="Other">Other timepass </option>
            </select>
          </div>

        </div>

        <button type="submit" class="btn-add">Add Expense</button>
      </form>
    </section>
      
  
    <section class="summary">
      <div class="summary-box total-box">
        <p>Total Spent</p>
        <h2 id="totalAmount">₹0.00</h2>
        <span id="expenseCount">0 expenses</span>
      </div>
      <div class="summary-box filter-box">
        <p id="filterTotal">All total: ₹0.00</p>
        <span>Shows the total of the category you are viewing where u probably waste ur money </span>
      </div>
    </section>
