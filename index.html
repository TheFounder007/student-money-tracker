<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .input-area {
      margin-bottom: 20px;
    }

    .input-area input,
    .input-area select {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    .add-btn {
      width: 100%;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px;
      font-size: 16px;
    }

    .add-btn:hover {
      background-color: #4338ca;
    }

    .error {
      color: red;
      font-size: 14px;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .filter {
      margin-bottom: 15px;
    }

    .expense {
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    .delete-btn {
      background-color: red;
      color: white;
      border: none;
      border-radius: 4px;
      float: right;
    }

    .delete-btn:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Student Expense Tracker</h1>

    <div class="input-area">
      <input type="text" id="name" placeholder="Expense name">
      <p class="error" id="nameError"></p>

      <input type="number" id="amount" placeholder="Amount (₹)">
      <p class="error" id="amountError"></p>

      <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>

      <button class="add-btn" onclick="addExpense()">Add Expense</button>
    </div>

    <div class="total">
      Total: ₹<span id="total">0</span>
    </div>

    <div class="filter">
      Show category:
      <select id="filter" onchange="showExpenses()">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div id="expenseList"></div>
  </div>

  <script>
    // This array stores all the expenses
    var expenses = [];

    function addExpense() {
      var name = document.getElementById("name").value;
      var amount = document.getElementById("amount").value;
      var category = document.getElementById("category").value;

      // Clear old error messages
      document.getElementById("nameError").innerHTML = "";
      document.getElementById("amountError").innerHTML = "";

      var isValid = true;

      // Check name
      if (name.trim() === "") {
        document.getElementById("nameError").innerHTML = "Please enter a name.";
        isValid = false;
      }

      // Check amount
      if (amount === "") {
        document.getElementById("amountError").innerHTML = "Please enter an amount.";
        isValid = false;
      } else if (Number(amount) <= 0) {
        document.getElementById("amountError").innerHTML = "Amount must be more than 0.";
        isValid = false;
      }

      if (isValid === false) {
        return;
      }

      // Save the expense
      var expense = {
        name: name,
        amount: Number(amount),
        category: category
      };
      expenses.push(expense);

      // Clear the input boxes
      document.getElementById("name").value = "";
      document.getElementById("amount").value = "";

      showExpenses();
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      showExpenses();
    }

    function showExpenses() {
      var filter = document.getElementById("filter").value;
      var list = document.getElementById("expenseList");
      var total = 0;

      list.innerHTML = "";

      for (var i = 0; i < expenses.length; i++) {
        var expense = expenses[i];

        // Show only the chosen category (or all)
        if (filter === "All" || filter === expense.category) {
          total = total + expense.amount;

          list.innerHTML += `
            <div class="expense">
              <button class="delete-btn" onclick="deleteExpense(${i})">Delete</button>
              <strong>${expense.name}</strong> (${expense.category})<br>
              ₹${expense.amount}
            </div>
          `;
        }
      }

      document.getElementById("total").innerHTML = total;
    }

    // Show empty list at start
    showExpenses();
  </script>

</body>
</html>
